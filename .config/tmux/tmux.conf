set-option -sa terminal-overrides ",xterm*:Tc"

unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

set-option -g allow-rename off
unbind-key C-s
unbind-key C-S-s
bind-key -Troot C-q display-popup -E -w 100% -h 100% "~/scripts/terminal.sh projects"
bind-key s display-popup -E -w 100% -h 100% "~/scripts/terminal.sh switch --all --persist-if-one --create"
bind-key Tab display-popup -E -w 100% -h 100% "~/scripts/terminal.sh switch --current --persist-if-one --create"
bind-key N run-shell "~/scripts/terminal.sh new --current"
bind-key S choose-tree -Zs

# ergonomics
bind-key -r C-l last-window
bind-key -r C-n next-window
bind-key -r C-p previous-window

bind-key -r x kill-pane
bind-key -r ` switch-client -l

# mouse
set -g mouse on

# window numbering
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# same cwd pane
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# bind-key -r s run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh"

# set vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi L send -X end-of-line
bind-key -T copy-mode-vi H send -X start-of-line

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'

# to integrate with neovim
set -g status-justify absolute-centre
set -g focus-events on
set -g status off
set -g extended-keys on
set -g extended-keys-format csi-u

# copy previous command from pane scrollback
# Placed after TPM because tmux-yank also binds prefix+y / prefix+Y.
bind-key y display-message "copying last command output..." \; run-shell -b "~/scripts/tmux-copy-last output --pane '#{pane_id}'"
bind-key Y display-message "copying last command block..." \; run-shell -b "~/scripts/tmux-copy-last block --pane '#{pane_id}'"

set-hook -g client-detached 'run-shell "~/scripts/terminal.sh clean"'
